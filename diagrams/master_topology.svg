<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .router{fill:#1f6feb;}.l3sw{fill:#238636;}.l2sw{fill:#8957e5;}.edge{fill:#d29922;}
      .isp{fill:#6e7681;}.host{fill:#0e7490;}.srv{fill:#bc4b51;}
      .devlbl{fill:#fff;font-size:15px;font-weight:700;text-anchor:middle;}
      .devsub{fill:#fff;font-size:10px;text-anchor:middle;opacity:.9;}
      .link{stroke:#8b949e;stroke-width:2;}.linkred{stroke:#f85149;stroke-width:2;stroke-dasharray:5 3;}
      .zone{fill:none;stroke:#30363d;stroke-width:1.4;stroke-dasharray:6 5;}
      .zlbl{fill:#57606a;font-size:13px;font-weight:700;letter-spacing:1px;}
      .title{fill:#c9d1d9;font-size:22px;font-weight:800;}.sub{fill:#8b949e;font-size:13px;}
      .note{fill:#8b949e;font-size:11px;}.llbl{fill:#6e7681;font-size:9px;}
    </style>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2.5" fill="#8b949e"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="820" fill="#0d1117"/>
  <text x="40" y="44" class="title">CCNP ENCOR 350-401 — Master Lab Topology</text>
  <text x="40" y="66" class="sub">One reusable enterprise campus + WAN edge covering the full ENCOR blueprint</text>
  <rect class="zone" x="40" y="90" width="1020" height="140" rx="12"/>
  <text x="52" y="110" class="zlbl">WAN / EDGE</text>
  <rect class="isp" x="120" y="130" width="120" height="60" rx="10"/><text x="180" y="156" class="devlbl">ISP</text><text x="180" y="176" class="devsub">BGP AS 65001</text>
  <rect class="edge" x="490" y="130" width="120" height="60" rx="10"/><text x="550" y="152" class="devlbl">EDGE1</text><text x="550" y="170" class="devsub">BGP • PBR • IPsec</text><text x="550" y="183" class="devsub">GRE tunnel</text>
  <rect class="srv" x="860" y="120" width="150" height="80" rx="10"/><text x="935" y="146" class="devlbl">SERVICES VM</text><text x="935" y="164" class="devsub">Automation host (Python)</text><text x="935" y="178" class="devsub">TACACS+ • NTP</text><text x="935" y="192" class="devsub">NetFlow collector</text>
  <line class="link" x1="240" y1="160" x2="490" y2="160" marker-start="url(#dot)" marker-end="url(#dot)"/><text x="330" y="152" class="llbl">eBGP</text>
  <line class="linkred" x1="610" y1="165" x2="860" y2="160"/><text x="690" y="152" class="llbl">mgmt / automation</text>
  <rect class="zone" x="40" y="250" width="1020" height="130" rx="12"/><text x="52" y="270" class="zlbl">CORE  —  OSPF / EIGRP backbone • BGP</text>
  <rect class="router" x="360" y="290" width="130" height="60" rx="10"/><text x="425" y="316" class="devlbl">CORE1</text><text x="425" y="335" class="devsub">OSPF area 0 • BGP</text>
  <rect class="router" x="610" y="290" width="130" height="60" rx="10"/><text x="675" y="316" class="devlbl">CORE2</text><text x="675" y="335" class="devsub">OSPF area 0 • BGP</text>
  <line class="link" x1="550" y1="190" x2="440" y2="290"/><line class="link" x1="550" y1="190" x2="660" y2="290"/>
  <line class="link" x1="490" y1="320" x2="610" y2="320" marker-start="url(#dot)" marker-end="url(#dot)"/>
  <rect class="zone" x="40" y="400" width="1020" height="140" rx="12"/><text x="52" y="420" class="zlbl">DISTRIBUTION  —  L3 switches • SVIs • FHRP • STP root</text>
  <rect class="l3sw" x="300" y="445" width="150" height="70" rx="10"/><text x="375" y="470" class="devlbl">DIST1</text><text x="375" y="488" class="devsub">SVIs • HSRP active</text><text x="375" y="502" class="devsub">STP root (pri)</text>
  <rect class="l3sw" x="650" y="445" width="150" height="70" rx="10"/><text x="725" y="470" class="devlbl">DIST2</text><text x="725" y="488" class="devsub">SVIs • HSRP standby</text><text x="725" y="502" class="devsub">STP root (sec)</text>
  <line class="link" x1="425" y1="350" x2="375" y2="445"/><line class="link" x1="425" y1="350" x2="725" y2="445"/><line class="link" x1="675" y1="350" x2="375" y2="445"/><line class="link" x1="675" y1="350" x2="725" y2="445"/>
  <line class="link" x1="450" y1="480" x2="650" y2="480" marker-start="url(#dot)" marker-end="url(#dot)"/><text x="530" y="472" class="llbl">L3 / trunk</text>
  <rect class="zone" x="40" y="560" width="1020" height="150" rx="12"/><text x="52" y="580" class="zlbl">ACCESS  —  L2 switches • VLANs • EtherChannel • STP protection</text>
  <rect class="l2sw" x="300" y="605" width="150" height="70" rx="10"/><text x="375" y="630" class="devlbl">ACC1</text><text x="375" y="648" class="devsub">VLANs • LACP Po1</text><text x="375" y="662" class="devsub">BPDU/Root Guard</text>
  <rect class="l2sw" x="650" y="605" width="150" height="70" rx="10"/><text x="725" y="630" class="devlbl">ACC2</text><text x="725" y="648" class="devsub">VLANs • UDLD</text><text x="725" y="662" class="devsub">Loop Guard</text>
  <line class="link" x1="375" y1="515" x2="375" y2="605"/><line class="link" x1="450" y1="500" x2="700" y2="605"/><line class="link" x1="725" y1="515" x2="725" y2="605"/><line class="link" x1="650" y1="500" x2="400" y2="605"/>
  <text x="382" y="560" class="llbl">Po (EtherChannel)</text>
  <rect class="host" x="300" y="720" width="150" height="46" rx="8"/><text x="375" y="740" class="devlbl">HOST-A</text><text x="375" y="757" class="devsub">VLAN 10 • mcast rx • IP SLA</text>
  <rect class="host" x="650" y="720" width="150" height="46" rx="8"/><text x="725" y="740" class="devlbl">HOST-B</text><text x="725" y="757" class="devsub">VLAN 20 • traffic gen</text>
  <line class="link" x1="375" y1="675" x2="375" y2="720"/><line class="link" x1="725" y1="675" x2="725" y2="720"/>
  <path d="M935 200 L935 660 L800 660" class="linkred" fill="none"/>
  <text x="946" y="430" class="note" transform="rotate(90 946,430)">automation / mgmt to all devices</text>
  <g transform="translate(40,782)">
    <rect class="router" x="0" y="-11" width="14" height="14" rx="3"/><text x="20" y="0" class="note">Router</text>
    <rect class="l3sw" x="90" y="-11" width="14" height="14" rx="3"/><text x="110" y="0" class="note">L3 Switch</text>
    <rect class="l2sw" x="200" y="-11" width="14" height="14" rx="3"/><text x="220" y="0" class="note">L2 Switch</text>
    <rect class="edge" x="300" y="-11" width="14" height="14" rx="3"/><text x="320" y="0" class="note">Edge</text>
    <rect class="srv" x="390" y="-11" width="14" height="14" rx="3"/><text x="410" y="0" class="note">Services/Automation</text>
    <rect class="host" x="545" y="-11" width="14" height="14" rx="3"/><text x="565" y="0" class="note">Host</text>
    <line class="linkred" x1="620" y1="-4" x2="650" y2="-4"/><text x="656" y="0" class="note">mgmt/automation</text>
  </g>
</svg>
