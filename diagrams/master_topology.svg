<svg viewBox="0 0 1320 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="760" fill="#0d1117"/>

  <!-- Title -->
  <text x="40" y="42" fill="#e6edf3" font-size="24" font-weight="700">CCNP ENCOR Lab — Infrastructure &amp; Services Plane</text>
  <text x="40" y="64" fill="#8b949e" font-size="13">Laptop 2 rebuild (ESXi + Docker) — updated 2026-10-05. PNETLab device-level topology intentionally left unverified (see note).</text>

  <!-- Legend -->
  <g font-size="11" fill="#8b949e">
    <rect x="1000" y="24" width="14" height="14" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.5"/>
    <text x="1020" y="35">Done / verified</text>
    <rect x="1000" y="46" width="14" height="14" rx="3" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
    <text x="1020" y="57">Decided, not built yet</text>
    <rect x="1150" y="24" width="14" height="14" rx="3" fill="#0d1117" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="1170" y="35">Pending / unverified</text>
  </g>

  <!-- Laptop 1 container -->
  <rect x="40" y="100" width="380" height="600" rx="16" fill="none" stroke="#30363d" stroke-dasharray="5 4" stroke-width="1"/>
  <text x="56" y="126" fill="#e6edf3" font-size="14" font-weight="600">Laptop 1 — VMware Workstation</text>

  <g>
    <rect x="60" y="150" width="340" height="70" rx="10" fill="#0d1117" stroke="#39c5cf" stroke-width="1.5"/>
    <text x="230" y="178" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">PNETLab VM</text>
    <text x="230" y="198" text-anchor="middle" fill="#8b949e" font-size="11">192.168.1.222 · ethernet0+1 bridged</text>
  </g>

  <g>
    <rect x="60" y="238" width="340" height="110" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="230" y="262" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="600">Topology placement: PENDING</text>
    <text x="230" y="284" text-anchor="middle" fill="#8b949e" font-size="11">Live canvas not yet reconciled against</text>
    <text x="230" y="300" text-anchor="middle" fill="#8b949e" font-size="11">.unl export (14 nodes) vs. diagram ("3 placed")</text>
    <text x="230" y="320" text-anchor="middle" fill="#8b949e" font-size="11">— check before trusting either number</text>
  </g>

  <g>
    <rect x="60" y="364" width="340" height="60" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="230" y="390" text-anchor="middle" fill="#8b949e" font-size="12">Cloud/bridge node to Laptop 2 LAN</text>
    <text x="230" y="408" text-anchor="middle" fill="#8b949e" font-size="11">not yet wired in PNETLab topology</text>
  </g>

  <!-- Laptop 2 container -->
  <rect x="460" y="100" width="820" height="600" rx="16" fill="none" stroke="#30363d" stroke-dasharray="5 4" stroke-width="1"/>
  <text x="476" y="126" fill="#e6edf3" font-size="14" font-weight="600">Laptop 2 — ESXi Host</text>

  <!-- VM01 Windows Server -->
  <g>
    <rect x="480" y="150" width="380" height="150" rx="12" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
    <text x="670" y="178" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">VM01 — Windows Server 2019</text>
    <text x="670" y="200" text-anchor="middle" fill="#8b949e" font-size="11">roles decided, not yet built</text>
    <text x="500" y="226" fill="#e3b341" font-size="12">• AD DS — identity backend</text>
    <text x="500" y="246" fill="#e3b341" font-size="12">• DNS — internal name resolution</text>
    <text x="500" y="266" fill="#e3b341" font-size="12">• DHCP — VLAN 10/20 dynamic addressing</text>
    <text x="500" y="286" fill="#e3b341" font-size="12">• NPS (RADIUS) — backed by AD identity</text>
  </g>

  <!-- VM02 Rocky / Docker host -->
  <g>
    <rect x="880" y="150" width="380" height="430" rx="12" fill="#0d1117" stroke="#2ea043" stroke-width="1.5"/>
    <text x="1070" y="178" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">VM02 — Control_VM (Rocky 10.2)</text>
    <text x="1070" y="198" text-anchor="middle" fill="#8b949e" font-size="11">192.168.1.231 static · admin+sudo · Docker Engine</text>

    <!-- Docker chips, 2 cols x 4 rows -->
    <g font-size="11.5">
      <rect x="900" y="214" width="165" height="46" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
      <text x="982" y="232" text-anchor="middle" fill="#e6edf3" font-weight="600">mysql-server</text>
      <text x="982" y="248" text-anchor="middle" fill="#8b949e" font-size="10">mysql:8.0 — done</text>

      <rect x="1075" y="214" width="165" height="46" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
      <text x="1157" y="232" text-anchor="middle" fill="#e6edf3" font-weight="600">zabbix-server</text>
      <text x="1157" y="248" text-anchor="middle" fill="#8b949e" font-size="10">7.0 LTS — done</text>

      <rect x="900" y="268" width="165" height="46" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
      <text x="982" y="286" text-anchor="middle" fill="#e6edf3" font-weight="600">zabbix-web</text>
      <text x="982" y="302" text-anchor="middle" fill="#8b949e" font-size="10">nginx+php — done</text>

      <rect x="1075" y="268" width="165" height="46" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
      <text x="1157" y="286" text-anchor="middle" fill="#e6edf3" font-weight="600">zabbix-agent</text>
      <text x="1157" y="302" text-anchor="middle" fill="#8b949e" font-size="10">agent2 — done</text>

      <rect x="900" y="322" width="165" height="46" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
      <text x="982" y="340" text-anchor="middle" fill="#e6edf3" font-weight="600">NTP</text>
      <text x="982" y="356" text-anchor="middle" fill="#8b949e" font-size="10">cturra/ntp — done</text>

      <rect x="1075" y="322" width="165" height="46" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
      <text x="1157" y="340" text-anchor="middle" fill="#e6edf3" font-weight="600">Syslog</text>
      <text x="1157" y="356" text-anchor="middle" fill="#8b949e" font-size="10">balabit/syslog-ng — done</text>

      <rect x="900" y="376" width="165" height="46" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="982" y="394" text-anchor="middle" fill="#8b949e" font-weight="600">TACACS+</text>
      <text x="982" y="410" text-anchor="middle" fill="#8b949e" font-size="10">image unverified/stale</text>

      <rect x="1075" y="376" width="165" height="46" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
      <text x="1157" y="394" text-anchor="middle" fill="#e6edf3" font-weight="600">Automation</text>
      <text x="1157" y="410" text-anchor="middle" fill="#8b949e" font-size="10">Netmiko/Jinja2 — planned</text>
    </g>

    <!-- Web UI access panel — nested INSIDE the VM02 box's own border, not a separate adjacent box -->
    <rect x="900" y="434" width="340" height="80" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="1070" y="458" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Web UI access (zabbix-web container)</text>
    <text x="1070" y="476" text-anchor="middle" fill="#8b949e" font-size="11">http://192.168.1.231/ — verified working</text>
    <text x="1070" y="494" text-anchor="middle" fill="#8b949e" font-size="11">agent interface fixed: 127.0.0.1 → zabbix-agent DNS</text>
  </g>

  <!-- Networking note (below everything, spans both columns since it applies to both) -->
  <!-- VM02 box bottom edge = 150+430 = 580, so this must start no earlier than ~600 -->
  <g>
    <rect x="480" y="600" width="760" height="70" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="860" y="624" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="600">Addressing correction (2026-10-04)</text>
    <text x="860" y="644" text-anchor="middle" fill="#8b949e" font-size="11">Planned isolated mgmt VLAN 99 (172.16.0.0/24) does not physically exist yet.</text>
    <text x="860" y="660" text-anchor="middle" fill="#8b949e" font-size="11">Both laptops currently share a flat 192.168.1.0/24 LAN — VLAN 99 is a real future task.</text>
  </g>

  <!-- LAN connection between the two laptops -->
  <line x1="400" y1="185" x2="460" y2="185" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="430" y="172" text-anchor="middle" fill="#8b949e" font-size="10">shared LAN</text>

  <!-- Footer -->
  <text x="40" y="730" fill="#6e7681" font-size="11">github.com/vikramjeet8105-engg/ccnp-encor-lab</text>
  <text x="40" y="748" fill="#6e7681" font-size="10">Draft — review before replacing the repo's official master_topology.svg/.png.</text>
</svg>
